name: Build app

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history and tags, to list what changed since the last release.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build (signed with the release key)
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_PASSWORD secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Read the app version
        id: version
        run: |
          echo "name=$(grep '^appVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "test=$(grep '^testBuild=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: |
          if [ "${{ steps.version.outputs.test }}" = "true" ]; then
            name="KahrabaTest-${{ steps.version.outputs.name }}-test-${{ github.run_number }}.apk"
          else
            name="KahrabaOrNot-${{ steps.version.outputs.name }}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$name"
          # Stop here if it isn't signed with the release key.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs Kahraba*.apk \
            | grep -i "SHA-256 digest: 77e93fa7e7c94c4e5304da0550bc84442694977a9650e52d926babf0fe5f6776"

      - name: Write the release notes
        id: notes
        run: python3 .github/release_notes.py "${{ steps.version.outputs.name }}" release-notes.md "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: KahrabaOrNot-apk
          path: "*.apk"

      # Test builds: a draft release only the owner sees (signed in on github.com), replacing the
      # previous test draft. Nothing is published, and the public "latest" release stays as it is.
      - name: Save as a private test build
        if: steps.version.outputs.test == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft and (.tag_name | startswith("test-"))) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          {
            echo "**Test build, not published.** It installs next to Kahraba or Not as a separate app, Kahraba Test, so your current app and its data stay as they are."
            echo ""
            echo "To try it with your rooms and history: in Kahraba or Not, Settings › Backup › back up; then in Kahraba Test, restore that file. To stop testing, uninstall Kahraba Test."
            echo ""
            sed -n '/^## Install/q;p' release-notes.md
          } > test-notes.md
          gh release create "test-${{ github.run_number }}" KahrabaTest-*.apk --draft \
            --target "$GITHUB_SHA" --title "Kahraba Test ${{ steps.version.outputs.name }} (test ${{ github.run_number }})" \
            --notes-file test-notes.md

      - name: Publish as a release (download this on the phone)
        if: steps.notes.outputs.publish == 'true' && steps.version.outputs.test != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build-${{ github.run_number }}
          name: Kahraba or Not ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: KahrabaOrNot-*.apk
          body_path: release-notes.md
