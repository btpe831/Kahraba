name: Build app

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history and tags, to list what changed since the last release.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build (signed with the release key)
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_PASSWORD secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Read the app version
        id: version
        run: echo "name=$(grep '^appVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "KahrabaOrNot-${{ steps.version.outputs.name }}.apk"
          # Stop here if it isn't signed with the release key.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs KahrabaOrNot-*.apk \
            | grep -i "SHA-256 digest: 77e93fa7e7c94c4e5304da0550bc84442694977a9650e52d926babf0fe5f6776"

      - name: Write the release notes
        id: notes
        run: python3 .github/release_notes.py "${{ steps.version.outputs.name }}" release-notes.md "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: KahrabaOrNot-apk
          path: "*.apk"

      - name: Publish as a release (download this on the phone)
        if: steps.notes.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build-${{ github.run_number }}
          name: Kahraba or Not ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: KahrabaOrNot-*.apk
          body_path: release-notes.md
