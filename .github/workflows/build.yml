name: Build app

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Read the app version
        id: version
        run: echo "name=$(grep '^appVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "KahrabaOrNot-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KahrabaOrNot-apk
          path: KahrabaOrNot-*.apk

      - name: Publish as a release (download this on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build-${{ github.run_number }}
          name: Kahraba or Not ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: KahrabaOrNot-*.apk
          body: |
            Install on the Android phone: tap the .apk file below, then allow "Install unknown apps" if asked.
