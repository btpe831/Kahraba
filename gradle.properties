org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The version people see. 1.0.0 was the first public version (test builds went up to 1.9.0).
# Small updates: 1.0.01, 1.0.02 ... 1.0.10, then 1.1.0, 1.1.01 ... Bigger changes: ask the owner
# first, and always confirm the version number with them before pushing.
# Android updates use the build number, so this label never forces a reinstall.
appVersion=1.0.0
