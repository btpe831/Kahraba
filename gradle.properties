org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The version people see: MAJOR.MINOR.PATCH. Small fixes bump PATCH (1.2.1 -> 1.2.2),
# a batch of new features bumps MINOR (-> 1.3.0), something big bumps MAJOR (-> 2.0.0).
# Android updates use the build number, so this label never forces a reinstall.
appVersion=1.2.1
